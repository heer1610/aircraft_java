spring.application.name=aircraft

# ──────────────────────────────────────────────
# MySQL / XAMPP  (create database: aircraftdb)
# ──────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/aircraftdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# ──────────────────────────────────────────────
# Hibernate / JPA
# ──────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ──────────────────────────────────────────────
# JWT
# ──────────────────────────────────────────────
jwt.secret=AircraftSecureJWTSecretKey2024MustBe256BitsLongOrMoreForHMACSHA256
jwt.expiration=86400000

# ──────────────────────────────────────────────
# Server
# ──────────────────────────────────────────────
server.port=8080

# Disable docker-compose auto-start
spring.docker.compose.enabled=false
