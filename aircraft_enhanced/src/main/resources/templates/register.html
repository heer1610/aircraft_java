<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AeroManage – Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0f1e 0%, #0d1b3e 40%, #0f2460 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 32px 16px;
    }
    .card {
      background: #0b1225;
      border-radius: 24px;
      width: min(520px, 100%);
      padding: 52px 44px;
      box-shadow: 0 40px 100px rgba(0,0,50,0.6), 0 0 0 1px rgba(255,255,255,0.06);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }
    .brand-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #4080ff, #00c8ff);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; color: #fff;
    }
    .brand-name { font-size: 1.3rem; font-weight: 700; color: #fff; }
    .brand-sub  { font-size: 0.72rem; color: rgba(255,255,255,0.4); letter-spacing: 2px; text-transform: uppercase; }
    h3 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .sub { color: rgba(255,255,255,0.4); font-size: 0.85rem; margin-bottom: 32px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.78rem; font-weight: 500; color: rgba(255,255,255,0.5); margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
    .input-wrap { position: relative; }
    .input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.25); font-size: 0.85rem; }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px 14px 12px 40px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 11px;
      color: #fff; font-size: 0.88rem; font-family: 'Inter', sans-serif;
      transition: border-color .2s, background .2s, box-shadow .2s;
      outline: none;
    }
    input:focus {
      border-color: #4080ff;
      background: rgba(64,128,255,0.08);
      box-shadow: 0 0 0 3px rgba(64,128,255,0.15);
    }

    /* Role selector */
    .role-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .role-card {
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .15s;
      position: relative;
    }
    .role-card:hover { border-color: rgba(64,128,255,0.4); background: rgba(64,128,255,0.06); }
    .role-card.selected { border-color: #4080ff; background: rgba(64,128,255,0.12); }
    .role-card .role-icon { font-size: 1.4rem; margin-bottom: 8px; }
    .role-card .role-name { font-size: 0.78rem; font-weight: 600; color: #fff; }
    .role-card .role-desc { font-size: 0.68rem; color: rgba(255,255,255,0.4); margin-top: 3px; }
    .role-card .check {
      position: absolute; top: 8px; right: 8px;
      width: 18px; height: 18px;
      background: #4080ff; border-radius: 50%;
      display: none; align-items: center; justify-content: center;
      font-size: 0.6rem; color: #fff;
    }
    .role-card.selected .check { display: flex; }

    .btn-primary {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #4080ff 0%, #6040ff 100%);
      border: none; border-radius: 12px;
      color: #fff; font-size: 0.95rem; font-weight: 600;
      font-family: 'Inter', sans-serif; cursor: pointer; margin-top: 8px;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 8px 24px rgba(64,128,255,0.35);
    }
    .btn-primary:hover  { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    .link-row { text-align: center; font-size: 0.85rem; color: rgba(255,255,255,0.4); margin-top: 20px; }
    .link-row a { color: #4080ff; text-decoration: none; font-weight: 500; }
    .link-row a:hover { text-decoration: underline; }

    .alert { padding: 12px 16px; border-radius: 10px; font-size: 0.84rem; margin-bottom: 16px; display: none; }
    .alert-error   { background: rgba(255,70,70,0.15); border: 1px solid rgba(255,70,70,0.3);  color: #ff7070; }
    .alert-success { background: rgba(0,200,100,0.12); border: 1px solid rgba(0,200,100,0.3);  color: #00d46a; }
    .alert.show { display: block; }

    .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-primary.loading .btn-label { display: none; }
    .btn-primary.loading .spinner   { display: block; }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-icon"><i class="fa-solid fa-plane"></i></div>
    <div>
      <div class="brand-name">AeroManage</div>
      <div class="brand-sub">Aircraft Management System</div>
    </div>
  </div>

  <h3>Create Account</h3>
  <p class="sub">Fill in your details to get started</p>

  <div class="alert alert-error"   id="errAlert"></div>
  <div class="alert alert-success" id="successAlert"></div>

  <div class="form-row">
    <div class="form-group">
      <label>Full Name</label>
      <div class="input-wrap">
        <i class="fa-solid fa-id-card"></i>
        <input type="text" id="fullName" placeholder="John Smith"/>
      </div>
    </div>
    <div class="form-group">
      <label>Username</label>
      <div class="input-wrap">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="username" placeholder="john.smith"/>
      </div>
    </div>
  </div>

  <div class="form-group">
    <label>Email Address</label>
    <div class="input-wrap">
      <i class="fa-solid fa-envelope"></i>
      <input type="email" id="email" placeholder="john@airline.com"/>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="password" placeholder="Min 6 characters"/>
      </div>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <div class="input-wrap">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="confirmPassword" placeholder="Repeat password"/>
      </div>
    </div>
  </div>

  <div class="form-group">
    <label>Select Role</label>
    <div class="role-grid">
      <div class="role-card selected" data-role="ROLE_VIEWER" onclick="selectRole(this)">
        <div class="role-icon">👁️</div>
        <div class="role-name">Viewer</div>
        <div class="role-desc">Read-only access</div>
        <div class="check"><i class="fa-solid fa-check"></i></div>
      </div>
      <div class="role-card" data-role="ROLE_TECHNICIAN" onclick="selectRole(this)">
        <div class="role-icon">🔧</div>
        <div class="role-name">Technician</div>
        <div class="role-desc">Manage aircraft &amp; maintenance</div>
        <div class="check"><i class="fa-solid fa-check"></i></div>
      </div>
      <div class="role-card" data-role="ROLE_ADMIN" onclick="selectRole(this)">
        <div class="role-icon">⚙️</div>
        <div class="role-name">Admin</div>
        <div class="role-desc">Full access</div>
        <div class="check"><i class="fa-solid fa-check"></i></div>
      </div>
    </div>
  </div>

  <button class="btn-primary" id="regBtn" onclick="doRegister()">
    <span class="btn-label">Create Account <i class="fa-solid fa-user-plus" style="margin-left:6px"></i></span>
    <span class="spinner"></span>
  </button>

  <div class="link-row">Already have an account? <a href="/login">Sign in</a></div>
</div>

<script>
  function selectRole(card) {
    document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
  }

  function showErr(msg) {
    const el = document.getElementById('errAlert');
    el.textContent = msg; el.classList.add('show');
    document.getElementById('successAlert').classList.remove('show');
  }
  function showSuccess(msg) {
    const el = document.getElementById('successAlert');
    el.textContent = msg; el.classList.add('show');
    document.getElementById('errAlert').classList.remove('show');
  }

  async function doRegister() {
    const btn = document.getElementById('regBtn');
    const fullName       = document.getElementById('fullName').value.trim();
    const username       = document.getElementById('username').value.trim();
    const email          = document.getElementById('email').value.trim();
    const password       = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const role = document.querySelector('.role-card.selected')?.dataset.role || 'ROLE_VIEWER';

    if (!username || !email || !password) { showErr('Please fill in all required fields.'); return; }
    if (password !== confirmPassword)     { showErr('Passwords do not match.'); return; }
    if (password.length < 6)              { showErr('Password must be at least 6 characters.'); return; }

    btn.classList.add('loading');
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullName, username, email, password, roles: role })
      });
      const data = await res.json();
      if (!res.ok) { showErr(data.message || data.error || 'Registration failed.'); return; }
      localStorage.setItem('token', data.token);
      localStorage.setItem('username', data.username);
      localStorage.setItem('email', data.email);
      localStorage.setItem('roles', JSON.stringify(data.roles));
      showSuccess('Account created successfully! Redirecting to dashboard…');
      setTimeout(() => window.location.href = '/dashboard', 1000);
    } catch(e) {
      showErr('Server unreachable. Make sure the backend is running.');
    } finally {
      btn.classList.remove('loading');
    }
  }
</script>
</body>
</html>
