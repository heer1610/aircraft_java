<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AeroManage – Aircraft</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-base:#070d1f; --bg-card:#0c1530; --bg-card2:#0f1a38;
      --border:rgba(255,255,255,0.07); --accent:#4080ff; --accent2:#00c8ff;
      --success:#00d46a; --warning:#ffb800; --danger:#ff4d4d;
      --text:#ffffff; --text-muted:rgba(255,255,255,0.45); --sidebar-w:240px;
    }
    body { font-family:'Inter',sans-serif; background:var(--bg-base); color:var(--text); display:flex; min-height:100vh; }

    /* Sidebar */
    .sidebar { width:var(--sidebar-w); flex-shrink:0; background:var(--bg-card); border-right:1px solid var(--border); display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:100; }
    .sidebar-logo { padding:24px 20px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
    .logo-icon { width:40px; height:40px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
    .logo-text { font-size:1.1rem; font-weight:700; }
    .logo-sub  { font-size:0.65rem; color:var(--text-muted); letter-spacing:1.5px; text-transform:uppercase; }
    .sidebar-nav { flex:1; padding:16px 10px; overflow-y:auto; }
    .nav-section-label { font-size:0.65rem; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-muted); padding:12px 10px 6px; }
    .nav-item { display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:10px; color:var(--text-muted); font-size:0.88rem; font-weight:500; text-decoration:none; cursor:pointer; transition:background .15s,color .15s; margin-bottom:2px; }
    .nav-item:hover  { background:rgba(255,255,255,0.05); color:var(--text); }
    .nav-item.active { background:rgba(64,128,255,0.15); color:var(--accent); }
    .nav-item i { width:18px; text-align:center; font-size:0.9rem; }
    .sidebar-footer { padding:16px 10px; border-top:1px solid var(--border); }
    .user-pill { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:10px; background:rgba(255,255,255,0.04); }
    .user-avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; font-size:0.8rem; font-weight:700; flex-shrink:0; }
    .user-name { font-size:0.82rem; font-weight:600; }
    .user-role { font-size:0.68rem; color:var(--text-muted); }
    .logout-btn { margin-left:auto; background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:0.9rem; padding:4px; border-radius:6px; transition:color .15s; }
    .logout-btn:hover { color:var(--danger); }

    /* Main */
    .main { margin-left:var(--sidebar-w); flex:1; display:flex; flex-direction:column; min-height:100vh; }
    .topbar { background:var(--bg-card); border-bottom:1px solid var(--border); padding:16px 32px; display:flex; align-items:center; gap:16px; }
    .topbar h1 { font-size:1.2rem; font-weight:700; flex:1; }
    .btn { padding:9px 18px; border-radius:10px; font-size:0.85rem; font-weight:600; font-family:'Inter',sans-serif; cursor:pointer; border:none; display:inline-flex; align-items:center; gap:8px; transition:opacity .2s,transform .15s; }
    .btn:hover { opacity:0.88; transform:translateY(-1px); }
    .btn-primary { background:linear-gradient(135deg,var(--accent),#6040ff); color:#fff; box-shadow:0 4px 16px rgba(64,128,255,0.35); }
    .btn-danger  { background:rgba(255,77,77,0.15); color:var(--danger); border:1px solid rgba(255,77,77,0.3); }
    .btn-edit    { background:rgba(64,128,255,0.12); color:var(--accent); border:1px solid rgba(64,128,255,0.25); }
    .btn-sm { padding:6px 12px; font-size:0.78rem; }

    .content { padding:32px; flex:1; }

    /* Filter bar */
    .filter-bar { display:flex; gap:14px; margin-bottom:24px; align-items:center; flex-wrap:wrap; }
    .search-wrap { position:relative; flex:1; min-width:220px; }
    .search-wrap i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:0.88rem; }
    .search-input { width:100%; padding:10px 14px 10px 40px; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:0.88rem; font-family:'Inter',sans-serif; outline:none; transition:border-color .2s; }
    .search-input:focus { border-color:var(--accent); }
    .filter-select { padding:10px 14px; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:0.88rem; font-family:'Inter',sans-serif; outline:none; cursor:pointer; }
    .filter-select:focus { border-color:var(--accent); }

    /* Table */
    .panel { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
    .panel-header { padding:20px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .panel-title { font-size:0.95rem; font-weight:600; }
    table { width:100%; border-collapse:collapse; }
    th { font-size:0.72rem; font-weight:600; text-transform:uppercase; letter-spacing:0.7px; color:var(--text-muted); padding:12px 20px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
    td { padding:14px 20px; font-size:0.85rem; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:rgba(255,255,255,0.02); }
    .status-badge { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:20px; font-size:0.72rem; font-weight:600; }
    .status-badge::before { content:''; width:6px; height:6px; border-radius:50%; }
    .status-ACTIVE      { background:rgba(0,212,106,0.1);  color:var(--success); border:1px solid rgba(0,212,106,0.25); }
    .status-ACTIVE::before { background:var(--success); }
    .status-MAINTENANCE { background:rgba(255,184,0,0.1);  color:var(--warning); border:1px solid rgba(255,184,0,0.25); }
    .status-MAINTENANCE::before { background:var(--warning); }
    .status-INACTIVE    { background:rgba(255,77,77,0.1);  color:var(--danger);  border:1px solid rgba(255,77,77,0.25); }
    .status-INACTIVE::before { background:var(--danger); }
    .empty-state { padding:56px 24px; text-align:center; color:var(--text-muted); }
    .empty-state i { font-size:2.5rem; margin-bottom:14px; display:block; opacity:0.25; }
    .pagination { display:flex; align-items:center; justify-content:space-between; padding:14px 24px; border-top:1px solid var(--border); font-size:0.82rem; color:var(--text-muted); }
    .page-btns { display:flex; gap:8px; }
    .page-btn { width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:none; color:var(--text-muted); cursor:pointer; font-size:0.82rem; transition:border-color .15s,color .15s; }
    .page-btn:hover,  .page-btn.active { border-color:var(--accent); color:var(--accent); }

    /* Modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); z-index:500; display:none; align-items:center; justify-content:center; padding:20px; }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--bg-card); border:1px solid var(--border); border-radius:20px; width:min(560px,100%); padding:36px; max-height:90vh; overflow-y:auto; }
    .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
    .modal-title { font-size:1.1rem; font-weight:700; }
    .modal-close { background:none; border:none; color:var(--text-muted); font-size:1.2rem; cursor:pointer; padding:4px; border-radius:8px; transition:color .15s; }
    .modal-close:hover { color:var(--text); }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .form-group { margin-bottom:0; }
    .form-group.full { grid-column:1/-1; }
    label { display:block; font-size:0.75rem; font-weight:500; color:var(--text-muted); margin-bottom:7px; letter-spacing:0.5px; text-transform:uppercase; }
    .form-control { width:100%; padding:11px 14px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:0.88rem; font-family:'Inter',sans-serif; outline:none; transition:border-color .2s,background .2s; }
    .form-control:focus { border-color:var(--accent); background:rgba(64,128,255,0.06); }
    .modal-footer { display:flex; gap:12px; justify-content:flex-end; margin-top:28px; padding-top:20px; border-top:1px solid var(--border); }
    .alert { padding:11px 14px; border-radius:9px; font-size:0.83rem; margin-bottom:16px; display:none; }
    .alert.show { display:block; }
    .alert-error   { background:rgba(255,70,70,0.12); border:1px solid rgba(255,70,70,0.28); color:#ff7070; }
    .alert-success { background:rgba(0,200,100,0.1);  border:1px solid rgba(0,200,100,0.28); color:var(--success); }
    .spinner-sm { width:14px; height:14px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .reg-num { font-weight:700; color:var(--accent2); }
    .badge-role { padding:4px 12px; border-radius:20px; font-size:0.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
    .badge-admin { background:rgba(255,64,64,0.15); color:#ff6464; border:1px solid rgba(255,64,64,0.3); }
    .badge-technician { background:rgba(64,128,255,0.15); color:#6496ff; border:1px solid rgba(64,128,255,0.3); }
    .badge-viewer { background:rgba(0,200,106,0.12); color:var(--success); border:1px solid rgba(0,200,106,0.3); }
  </style>
</head>
<body>
<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon"><i class="fa-solid fa-plane" style="color:#fff"></i></div>
    <div><div class="logo-text">AeroManage</div><div class="logo-sub">Fleet System</div></div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">Main</div>
    <a class="nav-item" href="/dashboard"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
    <a class="nav-item active" href="/aircraft"><i class="fa-solid fa-plane-departure"></i> Aircraft</a>
    <a class="nav-item" href="/maintenance"><i class="fa-solid fa-wrench"></i> Maintenance</a>
    <a class="nav-item" href="/airlines"><i class="fa-solid fa-building"></i> Airlines</a>
    <div class="nav-section-label" style="margin-top:8px">Account</div>
    <div class="nav-item" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</div>
  </nav>
  <div class="sidebar-footer">
    <div class="user-pill">
      <div class="user-avatar" id="avatarInitial">?</div>
      <div><div class="user-name" id="sidebarUsername">…</div><div class="user-role" id="sidebarRole"></div></div>
      <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
  </div>
</aside>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <h1><i class="fa-solid fa-plane-departure" style="color:var(--accent);margin-right:10px"></i>Aircraft Registry</h1>
    <span class="badge-role" id="roleBadge"></span>
    <button class="btn btn-primary" id="addBtn" onclick="openModal()"><i class="fa-solid fa-plus"></i> Add Aircraft</button>
  </div>

  <div class="content">
    <div class="filter-bar">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" class="search-input" id="searchInput" placeholder="Search by registration, model, manufacturer…" oninput="filterTable()"/>
      </div>
      <select class="filter-select" id="statusFilter" onchange="filterTable()">
        <option value="">All Statuses</option>
        <option value="ACTIVE">Active</option>
        <option value="MAINTENANCE">In Maintenance</option>
        <option value="INACTIVE">Inactive</option>
      </select>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">All Aircraft <span id="countLabel" style="color:var(--text-muted);font-weight:400;font-size:0.82rem"></span></span>
      </div>
      <div id="tableArea">
        <div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i>Loading aircraft…</div>
      </div>
      <div class="pagination" id="paginationBar" style="display:none">
        <span id="pageInfo"></span>
        <div class="page-btns" id="pageBtns"></div>
      </div>
    </div>
  </div>
</div>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Add Aircraft</span>
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="alert alert-error"   id="modalErr"></div>
    <div class="alert alert-success" id="modalOk"></div>
    <div class="form-grid">
      <div class="form-group">
        <label>Registration Number *</label>
        <input type="text" class="form-control" id="fRegNum" placeholder="e.g. VT-ANA"/>
      </div>
      <div class="form-group">
        <label>Status *</label>
        <select class="form-control" id="fStatus">
          <option value="ACTIVE">Active</option>
          <option value="MAINTENANCE">In Maintenance</option>
          <option value="INACTIVE">Inactive</option>
        </select>
      </div>
      <div class="form-group">
        <label>Manufacturer *</label>
        <input type="text" class="form-control" id="fManuf" placeholder="e.g. Boeing"/>
      </div>
      <div class="form-group">
        <label>Model *</label>
        <input type="text" class="form-control" id="fModel" placeholder="e.g. 737 MAX"/>
      </div>
      <div class="form-group">
        <label>Year of Manufacture</label>
        <input type="number" class="form-control" id="fYear" placeholder="e.g. 2019" min="1900" max="2030"/>
      </div>
      <div class="form-group">
        <label>Airline</label>
        <select class="form-control" id="fAirline">
          <option value="">— None —</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()" style="background:rgba(255,255,255,0.06);color:var(--text)">Cancel</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveAircraft()">
        <span id="saveBtnLabel"><i class="fa-solid fa-floppy-disk"></i> Save</span>
        <span id="saveBtnSpinner" class="spinner-sm" style="display:none"></span>
      </button>
    </div>
  </div>
</div>

<script>
  const API = 'http://localhost:8080';
  const token = localStorage.getItem('token');
  const roles = JSON.parse(localStorage.getItem('roles') || '[]');
  const username = localStorage.getItem('username') || 'User';
  if (!token) { window.location.href = '/login'; }

  document.getElementById('sidebarUsername').textContent = username;
  document.getElementById('avatarInitial').textContent   = username.charAt(0).toUpperCase();
  const primaryRole = roles.find(r=>r.includes('ADMIN')) || roles.find(r=>r.includes('TECHNICIAN')) || 'ROLE_VIEWER';
  const roleLabel = primaryRole.replace('ROLE_','');
  document.getElementById('sidebarRole').textContent = roleLabel;
  const badge = document.getElementById('roleBadge');
  badge.textContent = roleLabel; badge.className = 'badge-role badge-'+roleLabel.toLowerCase();

  const canEdit = roles.some(r => r.includes('ADMIN') || r.includes('TECHNICIAN'));
  const canDelete = roles.some(r => r.includes('ADMIN'));
  if (!canEdit) document.getElementById('addBtn').style.display = 'none';

  const hdrs = { 'Authorization':'Bearer '+token, 'Content-Type':'application/json' };
  let allAircraft = [], airlines = [], editId = null;
  const PAGE_SIZE = 10; let currentPage = 1;

  async function loadAirlines() {
    try {
      const res = await fetch(`${API}/api/airlines`, { headers: hdrs });
      airlines = await res.json();
      const sel = document.getElementById('fAirline');
      airlines.forEach(a => {
        const o = document.createElement('option');
        o.value = a.id; o.textContent = `${a.name} (${a.iataCode})`;
        sel.appendChild(o);
      });
    } catch(e) {}
  }

  async function loadAircraft() {
    try {
      const res = await fetch(`${API}/api/aircraft`, { headers: hdrs });
      if (res.status === 401) { window.location.href = '/login'; return; }
      allAircraft = await res.json();
      renderTable();
    } catch(e) {
      document.getElementById('tableArea').innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i>Failed to load aircraft. Is the server running?</div>';
    }
  }

  function filterTable() {
    currentPage = 1; renderTable();
  }

  function renderTable() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const st = document.getElementById('statusFilter').value;
    const filtered = allAircraft.filter(a => {
      const matchQ  = !q  || a.registrationNumber.toLowerCase().includes(q) || a.model.toLowerCase().includes(q) || a.manufacturer.toLowerCase().includes(q);
      const matchSt = !st || a.status === st;
      return matchQ && matchSt;
    });

    document.getElementById('countLabel').textContent = `(${filtered.length})`;
    const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    currentPage = Math.min(currentPage, totalPages);
    const slice = filtered.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);

    if (!slice.length) {
      document.getElementById('tableArea').innerHTML = '<div class="empty-state"><i class="fa-solid fa-plane"></i>No aircraft found</div>';
      document.getElementById('paginationBar').style.display = 'none';
      return;
    }

    const rows = slice.map(a => `
      <tr>
        <td><span class="reg-num">${a.registrationNumber}</span></td>
        <td>${a.manufacturer}</td>
        <td>${a.model}</td>
        <td>${a.yearOfManufacture || '—'}</td>
        <td>${a.airline ? a.airline.name : '<span style="color:var(--text-muted)">—</span>'}</td>
        <td><span class="status-badge status-${a.status}">${a.status}</span></td>
        <td>
          ${canEdit ? `<button class="btn btn-edit btn-sm" onclick="openEdit(${a.id})"><i class="fa-solid fa-pen"></i></button>` : ''}
          ${canDelete ? `<button class="btn btn-danger btn-sm" style="margin-left:6px" onclick="deleteAircraft(${a.id},'${a.registrationNumber}')"><i class="fa-solid fa-trash"></i></button>` : ''}
        </td>
      </tr>`).join('');

    document.getElementById('tableArea').innerHTML = `
      <table>
        <thead><tr><th>Reg. No.</th><th>Manufacturer</th><th>Model</th><th>Year</th><th>Airline</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;

    // Pagination
    document.getElementById('paginationBar').style.display = 'flex';
    document.getElementById('pageInfo').textContent = `Showing ${(currentPage-1)*PAGE_SIZE+1}–${Math.min(currentPage*PAGE_SIZE,filtered.length)} of ${filtered.length}`;
    let pagesHtml = '';
    for (let i=1;i<=totalPages;i++) pagesHtml += `<button class="page-btn${i===currentPage?' active':''}" onclick="goPage(${i})">${i}</button>`;
    document.getElementById('pageBtns').innerHTML = pagesHtml;
  }

  function goPage(p) { currentPage = p; renderTable(); }

  function openModal(id) {
    editId = null;
    document.getElementById('modalTitle').textContent = 'Add Aircraft';
    document.getElementById('fRegNum').value=''; document.getElementById('fModel').value='';
    document.getElementById('fManuf').value=''; document.getElementById('fYear').value='';
    document.getElementById('fStatus').value='ACTIVE'; document.getElementById('fAirline').value='';
    document.getElementById('modalErr').classList.remove('show');
    document.getElementById('modalOk').classList.remove('show');
    document.getElementById('modalOverlay').classList.add('open');
  }

  function openEdit(id) {
    const a = allAircraft.find(x=>x.id===id);
    if (!a) return;
    editId = id;
    document.getElementById('modalTitle').textContent = 'Edit Aircraft';
    document.getElementById('fRegNum').value  = a.registrationNumber;
    document.getElementById('fModel').value   = a.model;
    document.getElementById('fManuf').value   = a.manufacturer;
    document.getElementById('fYear').value    = a.yearOfManufacture || '';
    document.getElementById('fStatus').value  = a.status;
    document.getElementById('fAirline').value = a.airline?.id || '';
    document.getElementById('modalErr').classList.remove('show');
    document.getElementById('modalOk').classList.remove('show');
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
  document.getElementById('modalOverlay').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });

  async function saveAircraft() {
    const label = document.getElementById('saveBtnLabel');
    const spin  = document.getElementById('saveBtnSpinner');
    const errEl = document.getElementById('modalErr');
    errEl.classList.remove('show');
    const regNum = document.getElementById('fRegNum').value.trim();
    const model  = document.getElementById('fModel').value.trim();
    const manuf  = document.getElementById('fManuf').value.trim();
    const year   = document.getElementById('fYear').value;
    const status = document.getElementById('fStatus').value;
    const airlineId = document.getElementById('fAirline').value;
    if (!regNum||!model||!manuf||!status) { errEl.textContent='Please fill in all required fields.'; errEl.classList.add('show'); return; }
    const body = { registrationNumber:regNum, model, manufacturer:manuf, status, yearOfManufacture: year||null };
    if (airlineId) body.airline = { id: parseInt(airlineId) };
    label.style.display='none'; spin.style.display='inline-block';
    try {
      const url = editId ? `${API}/api/aircraft/${editId}` : `${API}/api/aircraft`;
      const method = editId ? 'PUT' : 'POST';
      const res = await fetch(url, { method, headers: hdrs, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.message || data.error || 'Save failed.'; errEl.classList.add('show'); return; }
      closeModal(); await loadAircraft();
    } catch(e) {
      errEl.textContent='Server error. Please try again.'; errEl.classList.add('show');
    } finally {
      label.style.display=''; spin.style.display='none';
    }
  }

  async function deleteAircraft(id, reg) {
    if (!confirm(`Delete aircraft ${reg}? This cannot be undone.`)) return;
    try {
      const res = await fetch(`${API}/api/aircraft/${id}`, { method:'DELETE', headers:hdrs });
      if (res.ok) await loadAircraft();
      else { const d = await res.json(); alert(d.message || 'Delete failed.'); }
    } catch(e) { alert('Server error.'); }
  }

  function logout() { localStorage.clear(); window.location.href='/login'; }

  loadAirlines();
  loadAircraft();
</script>
</body>
</html>
